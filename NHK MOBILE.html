<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>NHK MOBILE</title>

  <link rel="icon"
        href="https://drive.google.com/thumbnail?id=1FxUktmgWcMhDuIwDwmrAtD-OL0w2L2Ab">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #eee;
    }

    .iframe-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <div class="iframe-container">

    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbwqs8bKdPZZKQKj8OkHj0lETaNfAuXqW3w4BByn1rzVT_ljs14T3HNv0VsXQlMMy67J/exec"
      scrolling="yes"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
      allow="fullscreen; camera; microphone; display-capture; geolocation">
    </iframe>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>NHK MOBILE</title>

  <link rel="icon"
        href="https://github.com/nhkponpes-lang/NHKMOBILE/blob/main/a8c55e91-36d7-41b7-b647-3534f687a4be.jpg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #eee;
    }

    .iframe-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <div class="iframe-container">

    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbzmg328dfn6YpuUvZgl46ZMiLRvGHm1eRvwQLFJS6M/dev"
      scrolling="yes"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
      allow="fullscreen; camera; microphone; display-capture; geolocation">
    </iframe>

  </div>

</body>
</html>
